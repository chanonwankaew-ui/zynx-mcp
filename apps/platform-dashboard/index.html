<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zynx AGI Platform Topology</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 1.5rem;
      background: rgba(30, 41, 59, 0.8);
      border-bottom: 1px solid #334155;
      backdrop-filter: blur(10px);
    }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 600; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; color: transparent; }
    #container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    #mynetwork {
      flex: 3;
      height: 100%;
      border-right: 1px solid #334155;
    }
    #panel {
      flex: 1;
      padding: 1.5rem;
      background: #1e293b;
      overflow-y: auto;
    }
    .agent-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .tag {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: #38bdf820;
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: 500;
      margin-right: 0.5rem;
      margin-top: 0.5rem;
    }
    .placeholder-text { color: #64748b; font-size: 0.875rem; }
  </style>
</head>
<body>

  <header>
    <h1>Zynx AGI Platform : Agent Topology</h1>
  </header>

  <div id="container">
    <div id="mynetwork"></div>
    <div id="panel">
      <div id="agent-details">
        <p class="placeholder-text">Click on an agent node to view its capabilities and description.</p>
      </div>
    </div>
  </div>

  <script type="text/javascript">
    const agentData = {
      user: { id: "user", label: "User", title: "Human interacting with the system", color: "#64748b", shape: "circle", desc: "Initiates the workflow.", tags: [] },
      deeja: { id: "deeja", label: "DeejaAgent", title: "NLP Parser", color: "#818cf8", shape: "box", desc: "Thai NLP parser. Sends Intent to Orchestrator with exponential backoff retry + timeout race.", tags: ["NLP", "Thai", "Resilient"] },
      orchestrator: { id: "orchestrator", label: "OrchestratorAgent", title: "DAG Executor", color: "#f472b6", shape: "ellipse", desc: "DAG executor with concurrent processing (maxConcurrency), deadlock detection, global timeout, and per-step retry independent from global.", tags: ["DAG", "Concurrency", "Deadlock-Detection"] },
      planner: { id: "planner", label: "TaskPlannerAgent", title: "Plan Generator", color: "#38bdf8", shape: "box", desc: "Generates DAG plans via LLM. Outputs are strictly validated using Zod schemas.", tags: ["LLM", "Zod", "Planning"] },
      router: { id: "router", label: "LLMRouterAgent", title: "Model Router", color: "#34d399", shape: "box", desc: "Model registry with cost/latency scoring and fallback chain (e.g. GPT-4o-mini to Claude-3-Haiku).", tags: ["Routing", "Fallback", "Cost-Optimization"] },
      rag: { id: "rag", label: "RAGAgent", title: "Vector Search", color: "#fbbf24", shape: "box", desc: "Vector store query and re-ranking with strict timeouts.", tags: ["Vector-DB", "Search", "Timeout"] },
      notifier: { id: "notifier", label: "NotifierAgent", title: "Multi-Channel Notify", color: "#a78bfa", shape: "box", desc: "Handles Slack Block Kit, SendGrid, and LINE API with per-channel retries.", tags: ["Slack", "Email", "LINE", "Retry"] }
    };

    const nodes = new vis.DataSet(Object.values(agentData).map(a => ({
      id: a.id,
      label: a.label,
      shape: a.shape,
      color: { background: a.color, border: a.color },
      font: { color: "#fff", face: "Inter", size: 14 }
    })));

    const edges = new vis.DataSet([
      { from: "user", to: "deeja", arrows: "to", label: "Message", font: {color: "#94a3b8", size: 10} },
      { from: "deeja", to: "orchestrator", arrows: "to", label: "Intent (Zod)", font: {color: "#94a3b8", size: 10} },
      { from: "orchestrator", to: "planner", arrows: "to", label: "Request Plan", font: {color: "#94a3b8", size: 10} },
      { from: "planner", to: "orchestrator", arrows: "to", label: "TaskPlan DAG", font: {color: "#94a3b8", size: 10} },
      { from: "orchestrator", to: "rag", arrows: "to", dashes: true },
      { from: "orchestrator", to: "router", arrows: "to", dashes: true },
      { from: "orchestrator", to: "notifier", arrows: "to", dashes: true }
    ]);

    const container = document.getElementById("mynetwork");
    const data = { nodes: nodes, edges: edges };
    const options = {
      layout: { hierarchical: { direction: "UD", sortMethod: "directed", nodeSpacing: 150, levelSeparation: 150 } },
      physics: false,
      interaction: { hover: true }
    };
    const network = new vis.Network(container, data, options);

    network.on("click", function (params) {
      const detailsPanel = document.getElementById("agent-details");
      if (params.nodes.length > 0) {
        const nodeId = params.nodes[0];
        const agent = agentData[nodeId];
        
        let tagsHtml = agent.tags.map(t => `<span class="tag">${t}</span>`).join("");
        
        detailsPanel.innerHTML = `
          <div class="agent-card">
            <h2 style="margin-top:0; color:${agent.color}">${agent.label}</h2>
            <p style="color:#94a3b8; font-size:0.875rem; font-weight:600; text-transform:uppercase; letter-spacing:1px; margin-bottom:1rem">${agent.title}</p>
            <p style="line-height:1.6">${agent.desc}</p>
            <div style="margin-top: 1.5rem;">
              ${tagsHtml}
            </div>
          </div>
        `;
      } else {
        detailsPanel.innerHTML = '<p class="placeholder-text">Click on an agent node to view its capabilities and description.</p>';
      }
    });
  </script>
</body>
</html>
